<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-page">
  <nav class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo small">RIE</div><span>R.I.E.</span></div>
    <ul class="nav-links">
      <li><a href="dashboard.html">&#128202; <span data-i18n="nav_dashboard">Dashboard</span></a></li>
      <li class="active"><a href="libro_diario.html">&#128218; <span data-i18n="nav_diario">Libro Diario</span></a></li>
      <li><a href="prestamos.html">&#127974; <span data-i18n="nav_prestamos">Pr&eacute;stamos</span></a></li>
      <li><a href="cobros.html">&#128179; <span data-i18n="nav_cobros">Cobros</span></a></li>
      <li><a href="reportes.html">&#128196; <span data-i18n="nav_reportes">Reportes</span></a></li>
    </ul>
    <div class="sidebar-footer"><button onclick="cerrarSesion()" class="btn-logout" data-i18n="logout">Cerrar Sesi&oacute;n</button></div>
  </nav>
  <main class="main-content">
    <header class="top-bar">
      <h2 data-i18n="nav_diario">Libro Diario</h2>
      <div class="top-bar-right">
        <div class="lang-bar small">
          <button class="lang-btn" onclick="setLang('es')">ES</button>
          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
        </div>
        <span class="user-name" id="user-display">...</span>
      </div>
    </header>
    <section class="section-box">
      <h3 data-i18n="nuevo_movimiento">Nuevo Movimiento</h3>
      <form onsubmit="guardarMovimiento(event)">
        <div class="form-row">
          <div class="form-group"><label data-i18n="col_fecha">Fecha</label><input type="date" id="m-fecha" required/></div>
          <div class="form-group"><label data-i18n="col_tipo">Tipo</label>
            <select id="m-tipo">
              <option value="ingreso" data-i18n="ingreso">Ingreso</option>
              <option value="gasto" data-i18n="gasto">Gasto</option>
            </select>
          </div>
          <div class="form-group"><label data-i18n="col_valor">Valor</label><input type="number" id="m-valor" min="0.01" step="0.01" required placeholder="0.00"/></div>
          <div class="form-group"><label data-i18n="moneda">Moneda</label>
            <select id="m-moneda"><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CNY">CNY</option></select>
          </div>
        </div>
        <div class="form-group"><label data-i18n="col_concepto">Concepto</label><input type="text" id="m-concepto" required/></div>
        <div class="form-group"><label data-i18n="observaciones">Observaciones</label><input type="text" id="m-obs"/></div>
        <div id="mov-error" class="alert alert-error" style="display:none"></div>
        <div id="mov-ok" class="alert alert-ok" style="display:none"></div>
        <button type="submit" class="btn-primary" data-i18n="guardar">Guardar Movimiento</button>
      </form>
    </section>
    <section class="section-box">
      <div class="section-header"><h3 data-i18n="historial">Historial</h3></div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr>
            <th data-i18n="col_fecha">Fecha</th>
            <th data-i18n="col_concepto">Concepto</th>
            <th data-i18n="col_tipo">Tipo</th>
            <th data-i18n="col_valor">Valor</th>
            <th>Moneda</th>
            <th data-i18n="acciones">Acciones</th>
          </tr></thead>
          <tbody id="tabla-body"><tr><td colspan="6" class="empty-row">Cargando...</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer class="app-footer">Focus Bank International &mdash; R.I.E. Smart Finance</footer>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let usuarioActual = null;
    (async()=>{
      usuarioActual = await requireAuth();
      if (!usuarioActual) return;
      document.getElementById('m-fecha').value = new Date().toISOString().split('T')[0];
      document.getElementById('m-moneda').value = usuarioActual.moneda || 'USD';
      await renderTabla();
    })();

    async function guardarMovimiento(e) {
      e.preventDefault();
      const err = document.getElementById('mov-error');
      const ok  = document.getElementById('mov-ok');
      err.style.display = 'none'; ok.style.display = 'none';
      const fecha    = document.getElementById('m-fecha').value;
      const tipo     = document.getElementById('m-tipo').value;
      const valor    = parseFloat(document.getElementById('m-valor').value);
      const moneda   = document.getElementById('m-moneda').value;
      const concepto = document.getElementById('m-concepto').value.trim();
      const obs      = document.getElementById('m-obs').value.trim();
      if (!concepto || isNaN(valor) || valor <= 0) {
        err.textContent = 'Complete todos los campos.'; err.style.display='block'; return;
      }
      try {
        await crearMovimiento({ fecha, concepto, tipo, valor, moneda, observaciones: obs });
        document.getElementById('m-concepto').value = '';
        document.getElementById('m-valor').value = '';
        document.getElementById('m-obs').value = '';
        ok.textContent = '✅ Movimiento guardado.'; ok.style.display = 'block';
        setTimeout(()=>ok.style.display='none', 2000);
        await renderTabla();
      } catch(ex) {
        err.textContent = 'Error: ' + ex.message; err.style.display='block';
      }
    }

    async function renderTabla() {
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Cargando...</td></tr>';
      const movs = await obtenerMovimientos();
      if (!movs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Sin movimientos registrados</td></tr>'; return; }
      tbody.innerHTML = '';
      movs.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${fmtDate(m.fecha)}</td><td>${m.concepto}</td><td><span class="badge badge-${m.tipo}">${m.tipo}</span></td><td><strong>${fmtMoney(m.valor,m.moneda)}</strong></td><td>${m.moneda}</td><td><button class="btn-delete" onclick="eliminar('${m.id}')">Eliminar</button></td>`;
        tbody.appendChild(tr);
      });
    }

    async function eliminar(id) {
      if (!confirm('¿Eliminar este movimiento?')) return;
      await eliminarMovimiento(id);
      await renderTabla();
    }
  </script>
</body>
</html>
