<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance – Libro Diario</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="app-page">
  <nav class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo small">RIE</div><span>R.I.E.</span></div>
    <ul class="nav-links">
      <li><a href="dashboard.html">&#128202; Dashboard</a></li>
      <li class="active"><a href="libro_diario.html">&#128218; Libro Diario</a></li>
      <li><a href="prestamos.html">&#127974; Pr&eacute;stamos</a></li>
      <li><a href="cobros.html">&#128179; Cobros</a></li>
      <li><a href="reportes.html">&#128196; Reportes</a></li>
    </ul>
    <div class="sidebar-footer"><button onclick="logout()" class="btn-logout">Cerrar Sesi&oacute;n</button></div>
  </nav>
  <main class="main-content">
    <header class="top-bar">
      <h2>&#128218; Libro Diario</h2>
      <div class="top-bar-right">
        <div class="lang-bar small">
          <button class="lang-btn active" onclick="setLang('es')">ES</button>
          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
        </div>
        <span class="user-name" id="user-display">Usuario</span>
      </div>
    </header>
    <section class="section-box">
      <h3>&#10133; Nuevo Movimiento</h3>
      <form onsubmit="guardarMovimiento(event)">
        <div class="form-row">
          <div class="form-group"><label>Fecha</label><input type="date" id="m-fecha" required/></div>
          <div class="form-group"><label>Tipo</label>
            <select id="m-tipo">
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Gasto</option>
            </select>
          </div>
          <div class="form-group"><label>Valor</label><input type="number" id="m-valor" min="0.01" step="0.01" required placeholder="0.00"/></div>
          <div class="form-group"><label>Moneda</label>
            <select id="m-moneda">
              <option value="USD">USD</option><option value="EUR">EUR</option>
              <option value="GBP">GBP</option><option value="CNY">CNY</option>
            </select>
          </div>
        </div>
        <div class="form-group"><label>Concepto</label><input type="text" id="m-concepto" required placeholder="Descripci&oacute;n del movimiento"/></div>
        <div class="form-group"><label>Observaciones</label><input type="text" id="m-obs" placeholder="Opcional"/></div>
        <div id="mov-error" class="alert alert-error" style="display:none"></div>
        <button type="submit" class="btn-primary">&#128190; Guardar Movimiento</button>
      </form>
    </section>
    <section class="section-box">
      <div class="section-header"><h3>&#128203; Historial de Movimientos</h3></div>
      <table class="data-table">
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Valor</th><th>Moneda</th><th>Acciones</th></tr></thead>
        <tbody id="tabla-diario-body"><tr><td colspan="6" class="empty-row">Sin movimientos registrados</td></tr></tbody>
      </table>
    </section>
    <footer class="app-footer">Focus Bank International &mdash; R.I.E. Smart Finance MVP 1.0</footer>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/libro_diario.js"></script>
</body>
</html>
