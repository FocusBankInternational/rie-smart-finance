<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance - Reportes</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-page">
  <nav class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo small">RIE</div><span>R.I.E.</span></div>
    <ul class="nav-links">
      <li><a href="dashboard.html">&#128202; <span data-i18n="nav_dashboard">Dashboard</span></a></li>
      <li><a href="libro_diario.html">&#128218; <span data-i18n="nav_diario">Libro Diario</span></a></li>
      <li><a href="prestamos.html">&#127974; <span data-i18n="nav_prestamos">Pr&eacute;stamos</span></a></li>
      <li><a href="cobros.html">&#128179; <span data-i18n="nav_cobros">Cobros</span></a></li>
      <li class="active"><a href="reportes.html">&#128196; <span data-i18n="nav_reportes">Reportes</span></a></li>
    </ul>
    <div class="sidebar-footer"><button onclick="cerrarSesion()" class="btn-logout" data-i18n="logout">Cerrar Sesi&oacute;n</button></div>
  </nav>
  <main class="main-content">
    <header class="top-bar">
      <h2 data-i18n="nav_reportes">Reportes</h2>
      <div class="top-bar-right">
        <div class="lang-bar small">
          <button class="lang-btn" onclick="setLang('es')">ES</button>
          <button class="lang-btn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
        </div>
        <span class="user-name" id="user-display">...</span>
      </div>
    </header>
    <section class="section-box">
      <h3 data-i18n="generar_reporte">Generar Reporte</h3>
      <div class="form-row">
        <div class="form-group"><label data-i18n="tipo_reporte">Tipo</label>
          <select id="tipo-reporte" onchange="actualizarFiltros()">
            <option value="diario">Diario</option>
            <option value="mensual" selected>Mensual</option>
            <option value="anual">Anual</option>
          </select>
        </div>
        <div class="form-group" id="filtro-mes-div"><label>Mes</label><input type="month" id="filtro-mes"/></div>
        <div class="form-group" id="filtro-dia-div" style="display:none"><label>Fecha</label><input type="date" id="filtro-dia"/></div>
        <div class="form-group" id="filtro-anio-div" style="display:none"><label>A&ntilde;o</label><input type="number" id="filtro-anio" value="2026"/></div>
        <div class="form-group align-end"><button class="btn-primary" onclick="generarReporte()" style="width:auto;padding:10px 24px" data-i18n="generar">Generar</button></div>
      </div>
    </section>
    <section class="section-box" id="resultado" style="display:none">
      <div class="section-header">
        <h3 id="titulo-reporte">Reporte</h3>
        <button class="btn-sm" onclick="exportarCSV()" data-i18n="exportar_csv">Exportar CSV</button>
      </div>
      <div class="cards-grid mini">
        <div class="card card-green"><div class="card-icon">&#128176;</div><div class="card-info"><span>Ingresos</span><strong id="rep-ing">$0.00</strong></div></div>
        <div class="card card-red"><div class="card-icon">&#128184;</div><div class="card-info"><span>Gastos</span><strong id="rep-gas">$0.00</strong></div></div>
        <div class="card card-navy"><div class="card-icon">&#9878;&#65039;</div><div class="card-info"><span>Saldo</span><strong id="rep-sal">$0.00</strong></div></div>
      </div>
      <table class="data-table">
        <thead><tr><th data-i18n="col_fecha">Fecha</th><th data-i18n="col_concepto">Concepto</th><th data-i18n="col_tipo">Tipo</th><th data-i18n="col_valor">Valor</th><th>Moneda</th></tr></thead>
        <tbody id="rep-body"></tbody>
      </table>
    </section>
    <footer class="app-footer">Focus Bank International &mdash; R.I.E. Smart Finance</footer>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    let todosMovs = [];
    (async()=>{
      const u = await requireAuth();
      if (!u) return;
      document.getElementById('filtro-mes').value = new Date().toISOString().substring(0,7);
      todosMovs = await obtenerMovimientos();
    })();

    function actualizarFiltros() {
      const tipo = document.getElementById('tipo-reporte').value;
      document.getElementById('filtro-mes-div').style.display = tipo==='mensual'?'':'none';
      document.getElementById('filtro-dia-div').style.display = tipo==='diario'?'':'none';
      document.getElementById('filtro-anio-div').style.display = tipo==='anual'?'':'none';
    }

    function generarReporte() {
      const tipo = document.getElementById('tipo-reporte').value;
      const mon = 'USD';
      let filtrados = [], titulo = '';
      if (tipo==='diario') {
        const f = document.getElementById('filtro-dia').value;
        filtrados = todosMovs.filter(m=>m.fecha===f);
        titulo = 'Reporte Diario — ' + fmtDate(f);
      } else if (tipo==='mensual') {
        const mes = document.getElementById('filtro-mes').value;
        filtrados = todosMovs.filter(m=>m.fecha.startsWith(mes));
        titulo = 'Reporte Mensual — ' + mes;
      } else {
        const a = document.getElementById('filtro-anio').value;
        filtrados = todosMovs.filter(m=>m.fecha.startsWith(a));
        titulo = 'Reporte Anual — ' + a;
      }
      filtrados.sort((a,b)=>a.fecha.localeCompare(b.fecha));
      let ing=0, gas=0;
      filtrados.forEach(m=>{ const v=parseFloat(m.valor); if(m.tipo==='ingreso') ing+=v; else gas+=v; });
      document.getElementById('titulo-reporte').textContent = titulo;
      document.getElementById('rep-ing').textContent = fmtMoney(ing, mon);
      document.getElementById('rep-gas').textContent = fmtMoney(gas, mon);
      document.getElementById('rep-sal').textContent = fmtMoney(ing-gas, mon);
      const tbody = document.getElementById('rep-body');
      tbody.innerHTML = filtrados.length
        ? filtrados.map(m=>`<tr><td>${fmtDate(m.fecha)}</td><td>${m.concepto}</td><td><span class="badge badge-${m.tipo}">${m.tipo}</span></td><td><strong>${fmtMoney(m.valor,m.moneda)}</strong></td><td>${m.moneda}</td></tr>`).join('')
        : '<tr><td colspan="5" class="empty-row">Sin movimientos en este período</td></tr>';
      document.getElementById('resultado').style.display = '';
      window._rep = { titulo, filtrados };
    }

    function exportarCSV() {
      if (!window._rep) return;
      let csv = 'Fecha,Concepto,Tipo,Valor,Moneda\n';
      window._rep.filtrados.forEach(m => csv += `"${m.fecha}","${m.concepto}","${m.tipo}","${m.valor}","${m.moneda}"\n`);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = window._rep.titulo.replace(/\s+/g,'_') + '.csv';
      a.click();
    }
  </script>
</body>
</html>
