<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance – Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">RIE</div>
      <h1>R.I.E. Smart Finance</h1>
      <p class="brand-sub">Riqueza &bull; Inteligencia &bull; Energ&iacute;a</p>
      <p class="brand-sub2">Focus Bank International</p>
    </div>
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('es')">ES</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Correo electr&oacute;nico</label>
        <input type="email" id="correo" required placeholder="usuario@email.com"/>
      </div>
      <div class="form-group">
        <label>Contrase&ntilde;a</label>
        <input type="password" id="password" required placeholder="••••••••"/>
      </div>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn-primary" id="btn-login">Iniciar Sesi&oacute;n</button>
    </form>
    <p class="auth-link" style="margin-top:12px">
      <a href="#" onclick="mostrarRecuperar()" style="color:#888;font-size:12px">&iquest;Olvidaste tu contrase&ntilde;a?</a>
    </p>
    <div id="recuperar-box" style="display:none;margin-top:12px">
      <div class="form-group">
        <label>Ingresa tu correo para recuperar:</label>
        <input type="email" id="correo-recuperar" placeholder="usuario@email.com"/>
      </div>
      <button class="btn-secondary" style="width:100%;margin-top:4px" onclick="handleRecuperar()">Enviar correo de recuperaci&oacute;n</button>
      <div id="recuperar-ok" class="alert alert-ok" style="display:none;margin-top:8px"></div>
    </div>
    <p class="auth-link">&iquest;No tienes cuenta? <a href="register.html">Reg&iacute;strate aqu&iacute;</a></p>
    <p class="powered">Powered by Focus Bank International</p>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    function setLang(l) { localStorage.setItem('rie_lang',l); }
    function mostrarRecuperar() {
      const box = document.getElementById('recuperar-box');
      box.style.display = box.style.display==='none' ? '' : 'none';
    }
    async function handleLogin(e) {
      e.preventDefault();
      const err = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      err.style.display = 'none';
      btn.textContent = 'Iniciando...';
      btn.disabled = true;
      try {
        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;
        await iniciarSesion(correo, password);
        window.location.href = 'dashboard.html';
      } catch(ex) {
        err.textContent = 'Correo o contraseña incorrectos.';
        err.style.display = 'block';
        btn.textContent = 'Iniciar Sesión';
        btn.disabled = false;
      }
    }
    async function handleRecuperar() {
      const correo = document.getElementById('correo-recuperar').value.trim();
      const ok = document.getElementById('recuperar-ok');
      try {
        await recuperarPassword(correo);
        ok.textContent = '✅ Correo enviado. Revisa tu bandeja de entrada.';
        ok.style.display = 'block';
      } catch(ex) {
        ok.textContent = '❌ Error: ' + ex.message;
        ok.style.display = 'block';
        ok.className = 'alert alert-error';
      }
    }
    // Si ya hay sesión activa, ir al dashboard
    (async()=>{
      const s = await obtenerSesion();
      if(s) window.location.href = 'dashboard.html';
    })();
  </script>
</body>
</html>
