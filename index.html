<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <title>R.I.E. Smart Finance</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media(max-width:500px){
      .auth-card{padding:24px 16px;margin:10px;}
      .brand h1{font-size:18px;}
      .brand-logo{width:52px;height:52px;font-size:16px;}
      .form-row{flex-direction:column;}
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">RIE</div>
      <h1>R.I.E. Smart Finance</h1>
      <p class="brand-sub">Riqueza &bull; Inteligencia &bull; Energ&iacute;a</p>
      <p class="brand-sub2">Focus Bank International</p>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" onclick="cambiarIdioma('es')">ES</button>
      <button class="lang-btn" onclick="cambiarIdioma('en')">EN</button>
      <button class="lang-btn" onclick="cambiarIdioma('zh')">&#20013;&#25991;</button>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label id="lbl-email">Correo electr&oacute;nico</label>
        <input type="email" id="correo" required placeholder="usuario@email.com"/>
      </div>
      <div class="form-group">
        <label id="lbl-password">Contrase&ntilde;a</label>
        <input type="password" id="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"/>
      </div>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn-primary" id="btn-login">Iniciar Sesi&oacute;n</button>
    </form>

    <p style="text-align:center;margin-top:10px">
      <a href="#" onclick="toggleRecuperar();return false;" id="lnk-forgot"
         style="color:#888;font-size:12px;text-decoration:none">
        &iquest;Olvidaste tu contrase&ntilde;a?
      </a>
    </p>

    <div id="box-recuperar" style="display:none;margin-top:10px">
      <div class="form-group">
        <label id="lbl-rec">Ingresa tu correo:</label>
        <input type="email" id="correo-rec" placeholder="usuario@email.com"/>
      </div>
      <button class="btn-secondary" style="width:100%;margin-top:4px"
              onclick="handleRecuperar()" id="btn-rec">
        Enviar correo de recuperaci&oacute;n
      </button>
      <div id="rec-msg" style="display:none;margin-top:8px;padding:10px;border-radius:8px;font-size:13px"></div>
    </div>

    <p class="auth-link">
      <span id="lbl-noaccount">&iquest;No tienes cuenta?</span>
      <a href="register.html" id="lnk-register">Reg&iacute;strate aqu&iacute;</a>
    </p>
    <p class="powered">Powered by Focus Bank International</p>
  </div>

  <script src="js/supabase-config.js"></script>
  <script>
  // ================================================================
  // TRADUCCIONES — sin depender de i18n.js externo
  // ================================================================
  var TX = {
    es: {
      email:     "Correo electrónico",
      password:  "Contraseña",
      btn:       "Iniciar Sesión",
      forgot:    "¿Olvidaste tu contraseña?",
      rec_label: "Ingresa tu correo para recuperar:",
      rec_btn:   "Enviar correo de recuperación",
      noaccount: "¿No tienes cuenta?",
      register:  "Regístrate aquí",
      err_login: "Correo o contraseña incorrectos.",
      logging:   "Iniciando...",
      sending:   "Enviando...",
      sent_ok:   "✅ Correo enviado. Revisa tu bandeja de entrada.",
      sent_err:  "❌ Error al enviar. Verifica el correo ingresado.",
    },
    en: {
      email:     "Email address",
      password:  "Password",
      btn:       "Sign In",
      forgot:    "Forgot your password?",
      rec_label: "Enter your email to recover:",
      rec_btn:   "Send recovery email",
      noaccount: "Don't have an account?",
      register:  "Sign up here",
      err_login: "Incorrect email or password.",
      logging:   "Signing in...",
      sending:   "Sending...",
      sent_ok:   "✅ Email sent. Check your inbox.",
      sent_err:  "❌ Error sending. Please verify the email.",
    },
    zh: {
      email:     "电子邮件",
      password:  "密码",
      btn:       "登录",
      forgot:    "忘记密码？",
      rec_label: "输入您的电子邮件以恢复：",
      rec_btn:   "发送恢复邮件",
      noaccount: "没有账户？",
      register:  "在此注册",
      err_login: "电子邮件或密码不正确。",
      logging:   "登录中...",
      sending:   "发送中...",
      sent_ok:   "✅ 邮件已发送。请检查您的收件箱。",
      sent_err:  "❌ 发送错误。请验证输入的电子邮件。",
    }
  };

  var lang = localStorage.getItem('rie_lang') || 'es';

  function cambiarIdioma(l) {
    lang = l;
    localStorage.setItem('rie_lang', l);
    aplicarTextos();
  }

  function aplicarTextos() {
    var t = TX[lang] || TX['es'];
    document.getElementById('lbl-email').textContent     = t.email;
    document.getElementById('lbl-password').textContent  = t.password;
    document.getElementById('btn-login').textContent     = t.btn;
    document.getElementById('lnk-forgot').textContent    = t.forgot;
    document.getElementById('lbl-rec').textContent       = t.rec_label;
    document.getElementById('btn-rec').textContent       = t.rec_btn;
    document.getElementById('lbl-noaccount').textContent = t.noaccount;
    document.getElementById('lnk-register').textContent  = t.register;
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      var active = (lang==='zh' && b.textContent.indexOf('中')>=0) ||
                   (lang==='en' && b.textContent.trim()==='EN') ||
                   (lang==='es' && b.textContent.trim()==='ES');
      b.classList.toggle('active', active);
    });
    document.documentElement.lang = lang;
  }

  // Aplicar inmediatamente
  aplicarTextos();

  // ── FUNCIONES ────────────────────────────────────────────────
  function toggleRecuperar() {
    var box = document.getElementById('box-recuperar');
    box.style.display = box.style.display === 'none' ? '' : 'none';
  }

  async function handleLogin(e) {
    e.preventDefault();
    var t   = TX[lang] || TX['es'];
    var err = document.getElementById('login-error');
    var btn = document.getElementById('btn-login');
    err.style.display = 'none';
    btn.textContent = t.logging;
    btn.disabled = true;
    try {
      await iniciarSesion(
        document.getElementById('correo').value.trim(),
        document.getElementById('password').value
      );
      window.location.href = 'dashboard.html';
    } catch(ex) {
      err.textContent   = (TX[lang]||TX['es']).err_login;
      err.style.display = 'block';
      btn.textContent   = (TX[lang]||TX['es']).btn;
      btn.disabled      = false;
    }
  }

  async function handleRecuperar() {
    var t   = TX[lang] || TX['es'];
    var btn = document.getElementById('btn-rec');
    var msg = document.getElementById('rec-msg');
    var correo = document.getElementById('correo-rec').value.trim();
    btn.textContent = t.sending;
    btn.disabled    = true;
    try {
      await recuperarPassword(correo);
      msg.textContent   = t.sent_ok;
      msg.style.background = '#E8F5EE';
      msg.style.color      = '#1A6B3A';
    } catch(ex) {
      msg.textContent   = t.sent_err;
      msg.style.background = '#FFE8E8';
      msg.style.color      = '#8B1A1A';
    }
    msg.style.display = 'block';
    btn.textContent   = t.rec_btn;
    btn.disabled      = false;
  }

  // Si ya hay sesión activa ir directo al dashboard
  (async function() {
    try {
      var s = await obtenerSesion();
      if (s) window.location.href = 'dashboard.html';
    } catch(e) {}
  })();
  </script>
</body>
</html>
