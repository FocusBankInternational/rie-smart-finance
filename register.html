<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance &ndash; Registro</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">
  <div class="auth-card wide">
    <div class="brand">
      <div class="brand-logo">FBI</div>
      <h1>R.I.E. Smart Finance</h1>
      <p class="brand-sub">Riqueza &bull; Inteligencia &bull; Energ&iacute;a</p>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('es')">ES</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('zh')">&#20013;&#25991;</button>
    </div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="nombres">Nombres</label>
          <input type="text" id="nombres" required placeholder="Stalin"/>
        </div>
        <div class="form-group">
          <label data-i18n="apellidos">Apellidos</label>
          <input type="text" id="apellidos" required placeholder="Cevallos"/>
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="email">Correo electr&oacute;nico</label>
        <input type="email" id="correo" required placeholder="usuario@email.com"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="password">Contrase&ntilde;a</label>
          <input type="password" id="password" required placeholder="M&iacute;n. 8 caracteres"/>
        </div>
        <div class="form-group">
          <label data-i18n="confirm_password">Confirmar Contrase&ntilde;a</label>
          <input type="password" id="password2" required placeholder="Repite la contrase&ntilde;a"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-i18n="pais">Pa&iacute;s</label>
          <select id="pais">
            <option value="EC">Ecuador</option>
            <option value="CO">Colombia</option>
            <option value="PE">Per&uacute;</option>
            <option value="MX">M&eacute;xico</option>
            <option value="AR">Argentina</option>
            <option value="OTHER">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="moneda">Moneda preferida</label>
          <select id="moneda">
            <option value="USD">USD &mdash; D&oacute;lar</option>
            <option value="EUR">EUR &mdash; Euro</option>
            <option value="GBP">GBP &mdash; Libra</option>
            <option value="CNY">CNY &mdash; Yuan</option>
          </select>
        </div>
      </div>
      <div id="register-error" class="alert alert-error" style="display:none"></div>
      <div id="register-ok" class="alert alert-ok" style="display:none"></div>
      <button type="submit" class="btn-primary" data-i18n="register_btn">Crear Cuenta</button>
    </form>

    <p class="auth-link">
      <span data-i18n="have_account">&iquest;Ya tienes cuenta?</span>
      <a href="index.html" data-i18n="login_link">Inicia sesi&oacute;n</a>
    </p>
    <p class="powered">Powered by Focus Bank International</p>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
