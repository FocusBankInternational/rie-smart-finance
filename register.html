<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R.I.E. Smart Finance – Registro</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="auth-card wide">
    <div class="brand">
      <div class="brand-logo">RIE</div>
      <h1>R.I.E. Smart Finance</h1>
      <p class="brand-sub">Riqueza &bull; Inteligencia &bull; Energ&iacute;a</p>
    </div>
    <form onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group"><label>Nombres</label><input type="text" id="nombres" required placeholder="Stalin Jonas"/></div>
        <div class="form-group"><label>Apellidos</label><input type="text" id="apellidos" required placeholder="Cevallos Solorzano"/></div>
      </div>
      <div class="form-group"><label>Correo electr&oacute;nico</label><input type="email" id="correo" required placeholder="usuario@email.com"/></div>
      <div class="form-row">
        <div class="form-group"><label>Contrase&ntilde;a</label><input type="password" id="password" required placeholder="M&iacute;n. 8 caracteres"/></div>
        <div class="form-group"><label>Confirmar</label><input type="password" id="password2" required placeholder="Repite la contrase&ntilde;a"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Pa&iacute;s</label>
          <select id="pais"><option value="EC">Ecuador</option><option value="CO">Colombia</option><option value="PE">Per&uacute;</option><option value="MX">M&eacute;xico</option><option value="AR">Argentina</option><option value="OTHER">Otro</option></select>
        </div>
        <div class="form-group"><label>Moneda</label>
          <select id="moneda"><option value="USD">USD &mdash; D&oacute;lar</option><option value="EUR">EUR &mdash; Euro</option><option value="GBP">GBP &mdash; Libra</option><option value="CNY">CNY &mdash; Yuan</option></select>
        </div>
      </div>
      <div id="register-error" class="alert alert-error" style="display:none"></div>
      <div id="register-ok" class="alert alert-ok" style="display:none"></div>
      <button type="submit" class="btn-primary" id="btn-reg">Crear Cuenta</button>
    </form>
    <p class="auth-link">&iquest;Ya tienes cuenta? <a href="index.html">Inicia sesi&oacute;n</a></p>
    <p class="powered">Powered by Focus Bank International</p>
  </div>
  <script src="js/supabase-config.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const err = document.getElementById('register-error');
      const ok  = document.getElementById('register-ok');
      const btn = document.getElementById('btn-reg');
      err.style.display = 'none'; ok.style.display = 'none';
      const nombres   = document.getElementById('nombres').value.trim();
      const apellidos = document.getElementById('apellidos').value.trim();
      const correo    = document.getElementById('correo').value.trim();
      const password  = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const pais      = document.getElementById('pais').value;
      const moneda    = document.getElementById('moneda').value;
      if (password.length < 8) { err.textContent='La contraseña debe tener al menos 8 caracteres.'; err.style.display='block'; return; }
      if (password !== password2) { err.textContent='Las contraseñas no coinciden.'; err.style.display='block'; return; }
      btn.textContent = 'Creando cuenta...'; btn.disabled = true;
      try {
        await registrarUsuario({ nombres, apellidos, correo, password, pais, moneda, idioma: 'es' });
        ok.textContent = '✅ ¡Cuenta creada! Revisa tu correo para confirmar y luego inicia sesión.';
        ok.style.display = 'block';
        setTimeout(()=>{ window.location.href='index.html'; }, 3000);
      } catch(ex) {
        err.textContent = 'Error: ' + (ex.message || 'Inténtalo de nuevo.');
        err.style.display = 'block';
        btn.textContent = 'Crear Cuenta'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
